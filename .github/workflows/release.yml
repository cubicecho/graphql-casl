name: Release

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - main
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # One repo-wide version: semantic-release runs at the root, derives the
      # version from `v*` tags, and (via @semantic-release/exec) bumps every
      # workspace and publishes each one.
      #
      # npm authenticates via OIDC trusted publishing (id-token: write), so no
      # token is needed. Every package needs its own trusted-publisher entry,
      # and npm matches the entry's workflow filename against this file's name
      # exactly — an entry naming anything but `release.yml` will not match.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
